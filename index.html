<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dompetku v2</title>

<!-- FITUR: PREPARASI PWA -->
<meta name="theme-color" content="#2563EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10433/10433048.png">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Library Ekspor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

<style>
/* VARIABLES & BASE */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --surface2: #F9FAFB; --border: #E5E7EB;
  --text: #111827; --text2: #4B5563; --text3: #9CA3AF;
  --green: #059669; --green-bg: #D1FAE5; --red: #DC2626; --red-bg: #FEE2E2;
  --amber: #D97706; --amber-bg: #FEF3C7; --accent: #2563EB; --accent-bg: #DBEAFE;
  --purple: #7C3AED; --purple-bg: #EDE9FE;
  --radius: 16px; --radius-sm: 10px; --font: 'Plus Jakarta Sans', sans-serif;
  --mono: 'DM Mono', monospace; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
}
body.dark-theme {
  --bg: #121212; --surface: #1E1E1E; --surface2: #2C2C2C; --border: #333333;
  --text: #F3F4F6; --text2: #9CA3AF; --text3: #6B7280;
  --green: #34D399; --red: #F87171; --amber: #FBBF24; --accent: #60A5FA; --purple: #A78BFA;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; -webkit-tap-highlight-color: transparent; }

/* === STYLES UNTUK DROPDOWN EXPORT === */
.export-dropdown { position: relative; display: inline-block; }
.export-content { display: none; position: absolute; right: 0; background: var(--surface); min-width: 140px; box-shadow: var(--shadow); border-radius: var(--radius-sm); z-index: 500; border: 1px solid var(--border); }
.export-content button { color: var(--text); padding: 12px 16px; text-decoration: none; display: block; width: 100%; border: none; background: none; text-align: left; font-size: 13px; font-weight: 600; cursor: pointer; }
.export-content button:hover { background: var(--surface2); }
.export-dropdown:hover .export-content { display: block; }

/* LAYOUT & NAV */
.nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.nav-brand { font-size: 18px; font-weight: 800; color: var(--text); }
.nav-brand span { color: var(--accent); }
.nav-menu-wrap { position: relative; margin-left: 16px; margin-right: auto; }
.btn-menu { background: var(--surface2); border: 1px solid var(--border); padding: 8px 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; color: var(--text); cursor: pointer; }
.nav-dropdown { display: none; position: absolute; top: calc(100% + 10px); left: 0; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius-sm); flex-direction: column; width: 180px; z-index: 200; }
.nav-dropdown.show { display: flex; }
.nav-tab { padding: 14px 16px; text-align: left; font-size: 13px; font-weight: 600; color: var(--text2); background: none; border: none; cursor: pointer; }
.nav-tab:hover, .nav-tab.active { background: var(--surface2); color: var(--accent); }
.nav-right { display: flex; align-items: center; gap: 8px; }
.btn-theme, .btn-icon { background: var(--surface2); border: 1px solid var(--border); border-radius: 50%; width: 34px; height: 34px; cursor: pointer; color: var(--text); display:flex; align-items:center; justify-content:center;}
.btn-add { background: var(--text); color: var(--surface); border: none; padding: 8px 16px; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; }

#login-page { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
.login-card { background: var(--surface); padding: 40px 30px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; max-width: 360px; width: 90%; }
.btn-google { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 12px 20px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }

.container { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }
.page { display: none; animation: fadeIn 0.4s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }

.card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; }
.card-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;}
.card-title { font-size: 14px; font-weight: 700; color: var(--text); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); padding: 20px; position: relative; overflow: hidden; }
.stat-card::after { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
.stat-card.c-green::after { background: var(--green); } .stat-card.c-red::after { background: var(--red); }
.stat-card.c-blue::after { background: var(--accent); } .stat-card.c-amber::after { background: var(--amber); }

.row-item { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.row-info { flex: 1; min-width: 0; }
.row-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-meta { font-size: 12px; color: var(--text3); }
.row-right { text-align: right; }
.row-amount { font-size: 15px; font-weight: 700; font-family: var(--mono); }
.row-amount.out { color: var(--red); } .row-amount.in { color: var(--green); }
.btn-action { background: var(--surface2); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; color: var(--text2); margin-left: 4px; }

/* BARS & PROGRESS */
.bar-row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.bar-label { font-size: 13px; font-weight: 600; color: var(--text); width: 140px; flex-shrink: 0; }
.bar-track { flex: 1; background: var(--surface2); border-radius: 99px; height: 8px; overflow: hidden; }
.bar-fill { height: 100%; transition: width 0.8s; }
.bar-val { font-size: 13px; font-weight: 600; font-family: var(--mono); min-width: 85px; text-align: right; }

.cc-progress { padding: 20px; }
.cc-meta { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.cc-track { background: var(--surface2); border-radius: 99px; height: 12px; overflow: hidden; margin-bottom: 8px; }
.cc-fill { height: 100%; background: var(--amber); transition: width 0.8s; }

.tag-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tag-item { background: var(--surface2); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.tag-del { color: var(--red); cursor: pointer; font-weight: 800; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 12px; font-weight: 700; color: var(--text2); }
.action-buttons { display: flex; gap: 12px; margin-top: 10px; }
.btn-submit { flex: 1; background: var(--accent); color: white; border: none; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; }
.btn-cancel { flex: 1; background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 14px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; cursor: pointer; }

#loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--surface); opacity: 0.9; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loader.hidden { display: none; }
.spinner { width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .bar-label { width: 100px; font-size: 12px; }
}
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div></div>
<div id="toast-container"></div>

<!-- HALAMAN LOGIN -->
<div id="login-page">
  <div class="login-card">
    <div class="login-title">Dompet<span>ku</span> v2</div>
    <div class="login-desc">SaaS Expense Tracker</div>
    <button class="btn-google" onclick="loginGoogle()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="G"> Masuk dengan Google
    </button>
  </div>
</div>

<div id="app-content" style="display: none;">
  <nav class="nav">
    <div class="nav-brand">Dompet<span>ku</span> v2</div>
    <div class="nav-menu-wrap">
      <button class="btn-menu" id="btn-menu-text" onclick="toggleMenu()">Beranda ▾</button>
      <div class="nav-dropdown" id="nav-dropdown">
        <button class="nav-tab active" onclick="goTo('beranda', 'Beranda')">Beranda</button>
        <button class="nav-tab" onclick="goTo('transaksi', 'Detail Transaksi')">Detail Transaksi</button>
        <button class="nav-tab" onclick="goTo('analitik', 'Analitik')">Analitik & Tren</button>
        <button class="nav-tab" onclick="goTo('budget', 'Anggaran')">Anggaran</button>
        <button class="nav-tab" onclick="goTo('cc', 'Kontrol CC')">Kontrol CC</button>
        <button class="nav-tab" onclick="goTo('pengaturan', 'Pengaturan')">Pengaturan</button>
        <button class="nav-tab" onclick="logoutGoogle()" style="color:var(--red); border-top: 1px solid var(--border);">Logout</button>
      </div>
    </div>
    <div class="nav-right">
      <!-- FITUR: Dropdown Export Simpel -->
      <div class="export-dropdown">
        <button class="btn-icon">💾</button>
        <div class="export-content">
          <button onclick="exportPDF()">Laporan PDF</button>
          <button onclick="exportCSV()">Data Excel (CSV)</button>
        </div>
      </div>
      <button id="theme-toggle" class="btn-theme" onclick="toggleTheme()">🌙</button>
      <button class="btn-add" onclick="goTo('input', 'Catat')">+ Catat</button>
    </div>
  </nav>

  <!-- BERANDA -->
  <div class="container page active" id="page-beranda">
    <div class="period-bar"><select id="b-month" onchange="syncPeriod('b-month')"></select><select id="b-year" onchange="syncPeriod('b-year')"></select></div>
    <div class="stat-grid" id="b-accounts"></div>
    <div class="stat-grid" id="b-stats"></div>
    <div class="card"><div class="card-header"><span class="card-title">Aktivitas Terakhir</span></div><div class="card-body" id="b-recent"></div></div>
    <!-- ProgressBar CC yang sempat hilang -->
    <div class="card"><div class="card-header"><span class="card-title">Ringkasan Kartu Kredit</span></div><div class="card-body" id="b-cc"></div></div>
  </div>

  <!-- INPUT -->
  <div class="container page" id="page-input">
    <div class="card" style="padding: 24px;">
      <h3 id="form-title" style="margin-bottom: 20px;">Catat Transaksi</h3>
      <input type="hidden" id="f-id">
      <div class="form-grid">
        <div class="form-group"><label>Jenis</label><select id="f-jenis" onchange="updateKategoriDropdown()"><option value="Pengeluaran">Pengeluaran</option><option value="Pemasukan">Pemasukan</option></select></div>
        <div class="form-group"><label>Tanggal</label><input type="date" id="f-tanggal"></div>
        <div class="form-group"><label>Metode</label><select id="f-metode" onchange="checkAutoCC()"><option>QRIS/Transfer</option><option>Cash</option><option>Kartu Kredit</option></select></div>
        <div class="form-group"><label>Kategori</label><select id="f-kategori"></select></div>
      </div>
      <div class="form-group" style="margin-bottom:16px">
          <label>Nominal (Rp)</label>
          <input type="text" id="f-nominal-display" placeholder="0" oninput="formatRibuan(this)">
          <input type="hidden" id="f-nominal">
      </div>
      <div class="form-group" style="margin-bottom:16px">
        <label>Keterangan</label>
        <input type="text" id="f-ket" list="histori-ket" placeholder="Misal: Bensin Picanto..." oninput="syncFieldsFromHistory(this.value)">
        <datalist id="histori-ket"></datalist>
      </div>
      <div style="display:flex; gap: 20px; margin-bottom: 20px;">
        <label id="wrap-cc" style="display:flex; align-items:center; gap:8px; font-size:13px"><input type="checkbox" id="f-cc"> Tagihan CC</label>
        <label style="display:flex; align-items:center; gap:8px; font-size:13px"><input type="checkbox" id="f-recur"> Berulang</label>
      </div>
      <div class="action-buttons">
        <button class="btn-cancel" onclick="resetForm()">Batal</button>
        <button class="btn-submit" onclick="simpan()">Simpan Transaksi</button>
      </div>
    </div>
  </div>

  <!-- TRANSAKSI -->
  <div class="container page" id="page-transaksi">
    <div class="filter-bar">
      <select id="t-month" onchange="syncPeriod('t-month')"></select>
      <select id="t-year" onchange="syncPeriod('t-year')"></select>
      <select id="t-jenis" onchange="renderTransaksi()"><option value="">Semua Jenis</option><option value="Pengeluaran">Pengeluaran</option><option value="Pemasukan">Pemasukan</option></select>
    </div>
    <div class="card"><div class="card-body" id="t-list"></div></div>
  </div>

  <!-- ANALITIK -->
  <div class="container page" id="page-analitik">
    <div class="period-bar"><select id="a-month" onchange="syncPeriod('a-month')"></select><select id="a-year" onchange="syncPeriod('a-year')"></select></div>
    <div class="card" style="margin-bottom: 24px; border: 2px solid var(--accent-bg);"><div class="card-header" style="background: var(--surface2);"><span class="card-title" style="color: var(--accent);">Rekap Tahunan</span></div><div class="card-body" style="padding: 20px;"><div class="stat-grid" id="y-stats" style="margin-bottom: 0;"></div></div></div>
    <div class="card" style="padding: 20px; margin-bottom: 24px;"><canvas id="trendChart" height="120"></canvas></div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
        <div class="card"><div class="card-header"><span class="card-title">Porsi Pengeluaran</span></div><div class="card-body" id="a-kat"></div></div>
        <div class="card"><div class="card-header"><span class="card-title">Sumber Pemasukan</span></div><div class="card-body" id="a-masuk"></div></div>
    </div>
  </div>

  <!-- BUDGET -->
  <div class="container page" id="page-budget">
    <div class="card" style="padding: 24px; margin-bottom: 24px;">
      <h4>Atur Anggaran</h4>
      <div class="form-grid" style="margin-top: 16px;"><div class="form-group"><label>Kategori</label><select id="bg-kategori"></select></div><div class="form-group"><label>Batas (Rp)</label><input type="text" id="bg-limit-display" oninput="formatRibuan(this)"><input type="hidden" id="bg-limit"></div></div>
      <button class="btn-submit" onclick="simpanBudget()">Set Anggaran</button>
    </div>
    <div class="card"><div class="card-body" id="bg-list" style="padding: 20px;"></div></div>
  </div>

  <!-- KONTROL CC -->
  <div class="container page" id="page-cc">
    <div class="period-bar"><select id="c-month" onchange="syncPeriod('c-month')"></select><select id="c-year" onchange="syncPeriod('c-year')"></select></div>
    <div class="stat-grid" id="c-stats"></div>
    <!-- Bar Limit yang sempat hilang -->
    <div class="card"><div class="card-header"><span class="card-title">Penggunaan Limit</span></div><div class="card-body" id="c-bar"></div></div>
    <div class="card"><div class="card-header"><span class="card-title">Rincian Tagihan</span></div><div class="card-body" id="c-list"></div></div>
  </div>

  <!-- PENGATURAN -->
  <div class="container page" id="page-pengaturan">
    <div class="card" style="padding: 24px;">
      <h3 style="margin-bottom: 24px;">Pengaturan Aplikasi</h3>
      <div style="font-weight:700; margin-bottom:12px; color:var(--green);">🏷️ Kategori</div>
      <div class="form-grid">
        <div class="form-group"><label>Nama Baru</label><input type="text" id="new-kat-name"></div>
        <div class="form-group"><label>Jenis</label><select id="new-kat-type"><option value="Pengeluaran">Pengeluaran</option><option value="Pemasukan">Pemasukan</option></select></div>
      </div>
      <button class="btn-submit" onclick="tambahKategori()" style="background:var(--green);">Tambah Kategori</button>
      <div id="kat-list-pemasukan" class="tag-list"></div>
      <div id="kat-list-pengeluaran" class="tag-list"></div>
      
      <hr style="border:0; border-top:1px solid var(--border); margin: 30px 0;">
      <div style="font-weight:700; margin-bottom:12px; color:var(--accent);">💳 Kartu Kredit</div>
      <div class="form-grid">
        <div class="form-group"><label>Limit</label><input type="text" id="s-cc-limit-display" oninput="formatRibuan(this)"><input type="hidden" id="s-cc-limit"></div>
        <div class="form-group"><label>Tanggal Cut-off</label><input type="number" id="s-cc-cutoff"></div>
      </div>
      <button class="btn-submit" onclick="simpanPengaturanCC()">Simpan CC</button>
      
      <hr style="border:0; border-top:1px solid var(--border); margin: 30px 0;">
      <div style="font-weight:700; margin-bottom:12px; color:var(--purple);">🔄 Migrasi (.tsv)</div>
      <input type="file" id="file-import" accept=".tsv" style="font-size:12px; padding:10px; border:1px dashed var(--border); width:100%;">
      <button class="btn-submit" onclick="importDataTSV()" style="background:var(--purple); margin-top:10px;">Sinkronkan</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
  import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD8p2vn3_VSBgtKAQJThv6i-yTSR430wuk",
    authDomain: "dompetku-app-22ab5.firebaseapp.com",
    projectId: "dompetku-app-22ab5",
    storageBucket: "dompetku-app-22ab5.firebasestorage.app",
    messagingSenderId: "329761272621",
    appId: "1:329761272621:web:0d4dc882815beb89e399a4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  window.data = []; window.budgets = {}; 
  window.settings = { ccLimit: 10000000, ccCutoff: 15 };
  window.userCategories = { 
    Pemasukan: ['Gaji','Bonus','Sewa Gear'], 
    Pengeluaran: ['Makan','Transportasi','Picanto','Freediving','Tagihan'] 
  };
  let trendChart;
  const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const ICONS = { 'Picanto':'🚗','Transportasi':'⛽','Makan':'🍽️','Tagihan':'🏠','Freediving':'🤿','Gaji':'💵','Sewa Gear':'🏄‍♂️' };

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('app-content').style.display = 'block';
      await loadData();
    } else {
      currentUser = null;
      document.getElementById('login-page').style.display = 'flex';
      document.getElementById('app-content').style.display = 'none';
      hideLoading();
    }
  });

  async function loadData() {
    showLoading();
    try {
      const uid = currentUser.uid;
      const setSnap = await getDoc(doc(db, "users", uid, "settings", "config"));
      if (setSnap.exists()) {
        const d = setSnap.data();
        window.settings = { ccLimit: d.ccLimit || 10000000, ccCutoff: d.ccCutoff || 15 };
        if (d.categories) window.userCategories = d.categories;
      }
      document.getElementById('s-cc-limit-display').value = window.settings.ccLimit.toLocaleString('id-ID');
      document.getElementById('s-cc-limit').value = window.settings.ccLimit;
      document.getElementById('s-cc-cutoff').value = window.settings.ccCutoff;

      const budSnap = await getDocs(collection(db, "users", uid, "budgets"));
      window.budgets = {}; budSnap.forEach(d => { window.budgets[d.id] = d.data().limit; });

      const txSnap = await getDocs(collection(db, "users", uid, "transactions"));
      window.data = []; txSnap.forEach(d => { let r = d.data(); r.id = d.id; window.data.push(r); });
      
      updateKategoriDropdown(); updateAutocomplete(); renderAll(); renderCategoryList(); hideLoading();
    } catch(e) { hideLoading(); }
  }

  // --- MASKING NOMINAL ---
  window.formatRibuan = (el) => {
    let val = el.value.replace(/\D/g, "");
    if (!val) { el.value = ""; return; }
    el.value = parseInt(val).toLocaleString("id-ID");
    const targetId = el.id.replace("-display", "");
    const targetInput = document.getElementById(targetId);
    if(targetInput) targetInput.value = val;
  };

  // --- PDF EXPORT RAPI ---
  window.exportPDF = () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const sorted = [...window.data].sort((a,b) => new Date(a.tanggal) - new Date(b.tanggal));
    const grouped = sorted.reduce((acc, r) => {
        const key = `${r.bulan} ${r.tahun}`;
        if(!acc[key]) acc[key] = [];
        acc[key].push(r);
        return acc;
    }, {});

    let y = 15;
    doc.setFontSize(16); doc.text("Laporan Keuangan Dompetku", 14, y);
    y += 10;

    Object.entries(grouped).forEach(([month, items]) => {
        if (y > 240) { doc.addPage(); y = 20; }
        doc.setFontSize(12); doc.setTextColor(40); doc.text(month.toUpperCase(), 14, y);
        const rows = items.map(i => [i.tanggal, i.kategori, i.keterangan, i.nominal.toLocaleString('id-ID')]);
        doc.autoTable({ head: [['Tgl', 'Kat', 'Ket', 'Rp']], body: rows, startY: y + 2, theme: 'grid' });
        y = doc.lastAutoTable.finalY + 12;
    });
    doc.save("Laporan_Dompetku.pdf");
  };

  window.exportCSV = () => {
    const sorted = [...window.data].sort((a,b) => new Date(a.tanggal) - new Date(b.tanggal));
    const csv = "Tanggal,Bulan,Tahun,Jenis,Kategori,Metode,Nominal,Keterangan\n" + 
                sorted.map(d => [d.tanggal, d.bulan, d.tahun, d.jenis, d.kategori, d.metode, d.nominal, `"${d.keterangan}"`].join(",")).join("\n");
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "Data_Dompetku.csv"; link.click();
  };

  // --- AUTOCOMPLETE & COPY ---
  function updateAutocomplete() {
    const list = document.getElementById('histori-ket');
    const u = [...new Set(window.data.map(d => d.keterangan))];
    list.innerHTML = u.map(k => `<option value="${k}">`).join('');
  }

  window.syncFieldsFromHistory = (val) => {
    const m = window.data.find(d => d.keterangan === val);
    if(m) {
        document.getElementById('f-jenis').value = m.jenis;
        updateKategoriDropdown();
        document.getElementById('f-kategori').value = m.kategori;
        document.getElementById('f-metode').value = m.metode;
        document.getElementById('f-nominal-display').value = Number(m.nominal).toLocaleString('id-ID');
        document.getElementById('f-nominal').value = m.nominal;
        showToast('Form terisi otomatis!');
    }
  };

  window.copyToForm = (id) => {
    const r = window.data.find(d => d.id === id);
    if(!r) return;
    document.getElementById('f-jenis').value = r.jenis;
    updateKategoriDropdown();
    document.getElementById('f-kategori').value = r.kategori;
    document.getElementById('f-metode').value = r.metode;
    document.getElementById('f-nominal-display').value = Number(r.nominal).toLocaleString('id-ID');
    document.getElementById('f-nominal').value = r.nominal;
    document.getElementById('f-ket').value = r.keterangan;
    goTo('input', 'Catat');
  };

  // --- CORE LOGIC (CRUD) ---
  window.updateKategoriDropdown = () => {
    const j = document.getElementById('f-jenis').value;
    const cats = window.userCategories[j] || [];
    document.getElementById('f-kategori').innerHTML = cats.map(k => `<option value="${k}">${k}</option>`).join('');
    document.getElementById('bg-kategori').innerHTML = window.userCategories.Pengeluaran.map(k => `<option value="${k}">${k}</option>`).join('');
    document.getElementById('wrap-cc').style.display = j === 'Pemasukan' ? 'none' : 'flex';
  };

  window.simpan = async function() {
    const id = document.getElementById('f-id').value;
    const record = {
      tanggal: document.getElementById('f-tanggal').value, jenis: document.getElementById('f-jenis').value,
      kategori: document.getElementById('f-kategori').value, metode: document.getElementById('f-metode').value,
      nominal: parseFloat(document.getElementById('f-nominal').value) || 0,
      keterangan: document.getElementById('f-ket').value.trim(),
      bulan: MONTHS[new Date(document.getElementById('f-tanggal').value).getMonth()],
      tahun: new Date(document.getElementById('f-tanggal').value).getFullYear(),
      cc: document.getElementById('f-cc').checked, recurring: document.getElementById('f-recur').checked
    };
    if(!record.tanggal || !record.nominal) return showToast('Harap lengkapi data!');
    showLoading();
    try {
      if (id) await updateDoc(doc(db, "users", currentUser.uid, "transactions", id), record);
      else await addDoc(collection(db, "users", currentUser.uid, "transactions"), record);
      await loadData(); resetForm();
    } catch(e) { hideLoading(); }
  };

  window.hapusRecord = async function(id) {
    if(!confirm('Hapus?')) return;
    showLoading(); await deleteDoc(doc(db, "users", currentUser.uid, "transactions", id)); await loadData();
  };

  window.tambahKategori = async function() {
    const n = document.getElementById('new-kat-name').value.trim();
    const t = document.getElementById('new-kat-type').value;
    if(!n) return;
    window.userCategories[t].push(n);
    await setDoc(doc(db, "users", currentUser.uid, "settings", "config"), { ...window.settings, categories: window.userCategories });
    document.getElementById('new-kat-name').value = ''; await loadData();
  };

  window.hapusKategori = async function(type, name) {
    if(!confirm(`Hapus kategori ${name}?`)) return;
    window.userCategories[type] = window.userCategories[type].filter(k => k !== name);
    await setDoc(doc(db, "users", currentUser.uid, "settings", "config"), { ...window.settings, categories: window.userCategories });
    await loadData();
  };

  // --- RENDERERS ---
  window.renderAll = () => { renderBeranda(); renderTransaksi(); renderAnalitik(); renderBudget(); renderCC(); };

  window.renderBeranda = () => {
    const m = document.getElementById('b-month').value, y = parseInt(document.getElementById('b-year').value);
    const rows = window.data.filter(d => d.bulan === m && parseInt(d.tahun) === y);
    const mIn = rows.filter(r=>r.jenis==='Pemasukan').reduce((s,r)=>s+Number(r.nominal),0);
    const mOut = rows.filter(r=>r.jenis==='Pengeluaran' && r.kategori!=='Bayar Tagihan CC').reduce((s,r)=>s+Number(r.nominal),0);
    
    document.getElementById('b-stats').innerHTML = `<div class="stat-card c-green"><div class="stat-label">Pemasukan</div><div class="stat-value">${fmt(mIn)}</div></div><div class="stat-card c-red"><div class="stat-label">Pengeluaran</div><div class="stat-value">${fmt(mOut)}</div></div>`;
    const rec = [...rows].reverse().slice(0,5);
    document.getElementById('b-recent').innerHTML = rec.map(r => `
      <div class="row-item">
        <div class="row-info"><div class="row-name">${r.keterangan}</div><div class="row-meta">${r.kategori}</div></div>
        <div class="row-right"><div class="row-amount ${r.jenis==='Pemasukan'?'in':'out'}">${fmt(r.nominal)}</div>
        <button class="btn-action" onclick="copyToForm('${r.id}')">📋</button></div>
      </div>`).join('');
    
    // Perbaikan Bar CC Beranda
    const ccTotal = window.data.filter(r => r.cc && getCCPeriod(r.tanggal).bulan === m && getCCPeriod(r.tanggal).tahun === y).reduce((s,r)=>s+Number(r.nominal),0);
    const pct = Math.min((ccTotal/window.settings.ccLimit)*100, 100);
    document.getElementById('b-cc').innerHTML = `<div class="cc-progress"><div class="cc-meta"><span>Tagihan: ${fmt(ccTotal)}</span><span>Sisa: ${fmt(window.settings.ccLimit-ccTotal)}</span></div><div class="cc-track"><div class="cc-fill" style="width:${pct}%"></div></div></div>`;
  };

  window.renderAnalitik = () => {
    const m = document.getElementById('a-month').value, y = parseInt(document.getElementById('a-year').value);
    const yearRows = window.data.filter(r => parseInt(r.tahun) === y);
    const yIn = yearRows.filter(r=>r.jenis==='Pemasukan').reduce((s,r)=>s+Number(r.nominal),0);
    const yOut = yearRows.filter(r=>r.jenis==='Pengeluaran' && r.kategori!=='Bayar Tagihan CC').reduce((s,r)=>s+Number(r.nominal),0);
    document.getElementById('y-stats').innerHTML = `<div class="stat-card c-blue"><div class="stat-label">Tahun Masuk</div><div class="stat-value">${fmtS(yIn)}</div></div><div class="stat-card c-red"><div class="stat-label">Tahun Keluar</div><div class="stat-value">${fmtS(yOut)}</div></div>`;
    
    const rows = window.data.filter(d => d.bulan === m && parseInt(d.tahun) === y);
    // Porsi Pengeluaran
    const rOut = rows.filter(r=>r.jenis==='Pengeluaran' && r.kategori!=='Bayar Tagihan CC');
    const kat = {}; rOut.forEach(r => kat[r.kategori] = (kat[r.kategori]||0) + Number(r.nominal));
    const sorted = Object.entries(kat).sort((a,b)=>b[1]-a[1]); const max = sorted[0]?sorted[0][1]:1;
    document.getElementById('a-kat').innerHTML = sorted.map(([k,v]) => `<div class="bar-row"><div class="bar-label">${k}</div><div class="bar-track"><div class="bar-fill" style="width:${(v/max)*100}%;background:var(--red)"></div></div><div class="bar-val">${fmtS(v)}</div></div>`).join('');
    
    // Sumber Pemasukan
    const rIn = rows.filter(r=>r.jenis==='Pemasukan');
    const katIn = {}; rIn.forEach(r => katIn[r.kategori] = (katIn[r.kategori]||0) + Number(r.nominal));
    const sortedIn = Object.entries(katIn).sort((a,b)=>b[1]-a[1]); const maxIn = sortedIn[0]?sortedIn[0][1]:1;
    document.getElementById('a-masuk').innerHTML = sortedIn.map(([k,v]) => `<div class="bar-row"><div class="bar-label">${k}</div><div class="bar-track"><div class="bar-fill" style="width:${(v/maxIn)*100}%;background:var(--green)"></div></div><div class="bar-val">${fmtS(v)}</div></div>`).join('');
    
    renderChart();
  };

  window.renderCC = () => {
    const m = document.getElementById('c-month').value, y = parseInt(document.getElementById('c-year').value);
    const ccRows = window.data.filter(r => r.cc && getCCPeriod(r.tanggal).bulan === m && getCCPeriod(r.tanggal).tahun === y);
    const total = ccRows.reduce((s,r)=>s+Number(r.nominal),0);
    const pct = Math.min((total/window.settings.ccLimit)*100, 100);
    document.getElementById('c-stats').innerHTML = `<div class="stat-card c-amber"><div class="stat-label">Tagihan CC</div><div class="stat-value">${fmt(total)}</div></div><div class="stat-card c-blue"><div class="stat-label">Limit Sisa</div><div class="stat-value">${fmt(window.settings.ccLimit-total)}</div></div>`;
    document.getElementById('c-bar').innerHTML = `<div class="cc-progress"><div class="cc-meta"><span>Pemakaian: ${Math.round(pct)}%</span><span>Limit: ${fmtS(window.settings.ccLimit)}</span></div><div class="cc-track"><div class="cc-fill" style="width:${pct}%"></div></div></div>`;
    document.getElementById('c-list').innerHTML = ccRows.map(r => `<div class="row-item"><div class="row-info"><div class="row-name">${r.keterangan}</div><div class="row-meta">${r.tanggal}</div></div><div class="row-right row-amount out">-${fmt(r.nominal)}</div></div>`).join('');
  };

  // --- HELPERS ---
  window.fmt = (n) => 'Rp' + Math.round(n).toLocaleString('id-ID');
  window.fmtS = (n) => n >= 1000000 ? (n/1000000).toFixed(1) + 'jt' : (n/1000).toFixed(0) + 'rb';
  window.showToast = (m) => { const c = document.getElementById('toast-container'); const t = document.createElement('div'); t.className='toast'; t.innerText=m; c.appendChild(t); setTimeout(()=>t.remove(), 3000); };
  window.showLoading = () => document.getElementById('loader').classList.remove('hidden');
  window.hideLoading = () => document.getElementById('loader').classList.add('hidden');
  window.toggleTheme = () => document.body.classList.toggle('dark-theme');
  window.toggleMenu = () => document.getElementById('nav-dropdown').classList.toggle('show');
  window.syncPeriod = (s) => { const v = document.getElementById(s).value; ['b','t','a','c'].forEach(p => { const el = document.getElementById(p+'-'+s.split('-')[1]); if(el) el.value = v; }); renderAll(); };
  window.goTo = (p, t) => { document.querySelectorAll('.page').forEach(x => x.classList.remove('active')); document.getElementById('page-'+p).classList.add('active'); document.getElementById('btn-menu-text').innerText = t + ' ▾'; document.getElementById('nav-dropdown').classList.remove('show'); if(p==='analitik') renderChart(); };
  window.getCCPeriod = (dStr) => { const p = dStr.split('-'); let y = parseInt(p[0]), m = parseInt(p[1])-1, d = parseInt(p[2]); if (d > window.settings.ccCutoff) { m++; if (m > 11) { m = 0; y++; } } return { bulan: MONTHS[m], tahun: y }; };
  
  function renderCategoryList() {
    const r = (t, id) => document.getElementById(id).innerHTML = window.userCategories[t].map(k => `<div class="tag-item">${k} <span class="tag-del" onclick="hapusKategori('${t}','${k}')">×</span></div>`).join('');
    r('Pemasukan','kat-list-pemasukan'); r('Pengeluaran','kat-list-pengeluaran');
  }

  window.resetForm = () => { document.getElementById('f-id').value = ""; document.getElementById('f-nominal-display').value = ""; document.getElementById('f-ket').value = ""; goTo('beranda', 'Beranda'); };
  window.populateSelects = () => {
    const now = new Date(); const cm = MONTHS[now.getMonth()], cy = now.getFullYear();
    ['b','t','a','c'].forEach(p => {
        const mS = document.getElementById(p+'-month'), yS = document.getElementById(p+'-year');
        if(mS) MONTHS.forEach(m => mS.add(new Option(m,m,false,m===cm)));
        if(yS) [2025,2026,2027].forEach(y => yS.add(new Option(y,y,false,y===cy)));
    });
  };

  window.renderChart = () => {
    const ctx = document.getElementById('trendChart').getContext('2d');
    const y = document.getElementById('a-year').value;
    const dataIn = MONTHS.map(m => window.data.filter(d=>d.bulan===m && d.tahun==y && d.jenis==='Pemasukan').reduce((s,r)=>s+Number(r.nominal),0));
    const dataOut = MONTHS.map(m => window.data.filter(d=>d.bulan===m && d.tahun==y && d.jenis==='Pengeluaran').reduce((s,r)=>s+Number(r.nominal),0));
    if(trendChart) trendChart.destroy();
    trendChart = new Chart(ctx, { type: 'bar', data: { labels: MONTHS.map(m=>m.substr(0,3)), datasets: [{label:'Masuk',data:dataIn,backgroundColor:'#34D399',borderRadius:4},{label:'Keluar',data:dataOut,backgroundColor:'#F87171',borderRadius:4}]}, options: {responsive:true, plugins:{legend:{position:'bottom'}}}});
  };

  populateSelects(); updateAutocomplete();
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  document.getElementById('f-tanggal').value = d.toISOString().split('T')[0];
</script>
</body>
</html>
